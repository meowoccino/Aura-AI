
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111114">
<title>AURA</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111114;color:#f4f2f8;font-family:system-ui,sans-serif}
.app{height:100dvh;max-width:700px;margin:auto;display:flex;flex-direction:column}
header{padding:16px;border-bottom:1px solid #292932;display:flex;align-items:center;gap:12px}
.avatar{width:38px;height:38px;border-radius:50%;background:#a78bfa;color:#191522;display:grid;place-items:center;font-weight:bold}
h1{font-size:17px;margin:0}
.sub{font-size:12px;color:#a5a2b0;margin-top:3px}
#chat{flex:1;overflow:auto;padding:20px 14px;display:flex;flex-direction:column;gap:16px}
.welcome{text-align:center;color:#aaa6b5;margin:auto;line-height:1.6}
.welcome strong{display:block;color:#f4f2f8;font-size:24px;margin-bottom:8px}
.msg{max-width:85%;padding:12px 15px;border-radius:18px;background:#202027;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap}
.user{align-self:flex-end;background:#7660c9;border-bottom-right-radius:5px}
.assistant{align-self:flex-start;border-bottom-left-radius:5px}
form{display:flex;gap:8px;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom));border-top:1px solid #292932}
textarea{flex:1;resize:none;max-height:120px;border:1px solid #34333e;border-radius:22px;padding:12px;background:#1b1b21;color:white;font:inherit;outline:none}
button{width:46px;min-width:46px;border:0;border-radius:22px;background:#a78bfa;color:#191522;font-size:18px;font-weight:bold;padding:8px}
button:disabled{opacity:.5}
#login{padding:12px;display:flex;gap:8px;border-bottom:1px solid #292932}
#token{flex:1;min-width:0;border:1px solid #34333e;border-radius:12px;padding:10px;background:#1b1b21;color:white}
#login button{width:auto}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="avatar">A</div>
  <div>
    <h1>AURA</h1>
    <div class="sub" id="status">Private companion</div>
  </div>
</header>

<div id="login">
  <input id="token" type="password" autocomplete="current-password"
         placeholder="Your private access token" aria-label="Access token">
  <button id="connect" type="button">Connect</button>
</div>

<main id="chat">
  <div class="welcome">
    <strong>Hi, I'm AURA.</strong>
    Your conversation will be saved here.
  </div>
</main>

<form id="form">
  <textarea id="input" rows="1" placeholder="Message AURA..."
            aria-label="Message AURA" disabled></textarea>
  <button id="send" type="submit" disabled>↑</button>
</form>
</div>

<script>
const API_URL = "https://aura-svzi.onrender.com";
const chat = document.querySelector("#chat");
const input = document.querySelector("#input");
const form = document.querySelector("#form");
const send = document.querySelector("#send");
const statusText = document.querySelector("#status");
const tokenInput = document.querySelector("#token");
const connectButton = document.querySelector("#connect");

let token = "";
let busy = false;

let sessionId = localStorage.getItem("aura_session_id");
if (!sessionId) {
  sessionId = crypto.randomUUID();
  localStorage.setItem("aura_session_id", sessionId);
}

function addBubble(text, role) {
  chat.querySelector(".welcome")?.remove();
  const bubble = document.createElement("div");
  bubble.className = "msg " + role;
  bubble.textContent = text;
  chat.appendChild(bubble);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

async function api(path, body) {
  const response = await fetch(API_URL + path, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify(body)
  });

  const data = await response.json();
  if (!response.ok) {
    if (response.status === 401) {
      token = "";
      sessionStorage.removeItem("aura_access_token");
      input.disabled = true;
      send.disabled = true;
      statusText.textContent = "Access denied — reconnect";
    }
    throw new Error(data.error || "Request failed");
  }
  return data;
}

async function connect() {
  const entered = tokenInput.value.trim();
  token = entered || sessionStorage.getItem("aura_access_token") || "";

  if (!token) {
    statusText.textContent = "Enter your access token";
    return;
  }

  connectButton.disabled = true;
  statusText.textContent = "Connecting…";

  try {
    const data = await api("/history", { sessionId });
    sessionStorage.setItem("aura_access_token", token);
    tokenInput.value = "";
    tokenInput.placeholder = "Connected";
    input.disabled = false;
    send.disabled = false;
    chat.innerHTML = "";

    if (data.messages.length === 0) {
      const welcome = document.createElement("div");
      welcome.className = "welcome";
      welcome.innerHTML = "<strong>Hi, I'm AURA.</strong>What would you like to talk about?";
      chat.appendChild(welcome);
    } else {
      data.messages.forEach(message => addBubble(message.content, message.role));
    }

    statusText.textContent = "Connected · history restored";
  } catch (error) {
    token = "";
    statusText.textContent =
      error.message.includes("Access denied")
        ? "Incorrect access token"
        : "Could not connect — check Render";
    console.error(error);
  } finally {
    connectButton.disabled = false;
  }
}

connectButton.addEventListener("click", connect);
tokenInput.addEventListener("keydown", event => {
  if (event.key === "Enter") connect();
});

token = sessionStorage.getItem("aura_access_token") || "";
if (token) connect();

form.addEventListener("submit", async event => {
  event.preventDefault();
  const text = input.value.trim();
  if (!text || send.disabled || busy) return;

  addBubble(text, "user");
  input.value = "";
  input.style.height = "auto";
  busy = true;
  send.disabled = true;
  statusText.textContent = "AURA is thinking…";
  const waiting = addBubble("Thinking…", "assistant");

  try {
    const data = await api("/chat", { sessionId, text });
    waiting.textContent = data.reply;
    statusText.textContent = "Connected · history saved";
  } catch (error) {
    waiting.textContent = "I couldn't complete that request. " + error.message;
    statusText.textContent = "Connection issue";
    console.error(error);
  } finally {
    busy = false;
    send.disabled = !token;
    input.focus();
    chat.scrollTop = chat.scrollHeight;
  }
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
});

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});
</script>
</body>
</html>
