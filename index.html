
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111114">
<title>AURA</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111114;color:#f4f2f8;font-family:system-ui,sans-serif}
.app{height:100dvh;max-width:700px;margin:auto;display:flex;flex-direction:column}
header{padding:16px;border-bottom:1px solid #292932;display:flex;align-items:center;gap:12px}
.avatar{width:38px;height:38px;border-radius:50%;background:#a78bfa;color:#191522;display:grid;place-items:center;font-weight:bold}
h1{font-size:17px;margin:0}
.sub{font-size:12px;color:#a5a2b0;margin-top:3px}
#chat{flex:1;overflow:auto;padding:20px 14px;display:flex;flex-direction:column;gap:16px}
.welcome{text-align:center;color:#aaa6b5;margin:auto;line-height:1.6}
.welcome strong{display:block;color:#f4f2f8;font-size:24px;margin-bottom:8px}
.msg{max-width:85%;padding:12px 15px;border-radius:18px;background:#202027;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap}
.user{align-self:flex-end;background:#7660c9;border-bottom-right-radius:5px}
.assistant{align-self:flex-start;border-bottom-left-radius:5px}
form{display:flex;gap:8px;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom));border-top:1px solid #292932}
textarea{flex:1;resize:none;max-height:120px;border:1px solid #34333e;border-radius:22px;padding:12px;background:#1b1b21;color:white;font:inherit;outline:none}
button{width:46px;min-width:46px;border:0;border-radius:50%;background:#a78bfa;color:#191522;font-size:22px;font-weight:bold}
button:disabled{opacity:.5}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="avatar">A</div>
  <div>
    <h1>AURA</h1>
    <div class="sub" id="status">Your AI companion</div>
  </div>
</header>

<main id="chat">
  <div class="welcome">
    <strong>Hi, I'm AURA.</strong>
    This is our little space to talk.<br>
    What would you like to talk about?
  </div>
</main>

<form id="form">
  <textarea id="input" rows="1" placeholder="Message AURA..." aria-label="Message AURA"></textarea>
  <button id="send" aria-label="Send" type="submit">↑</button>
</form>
</div>

<script>
const API_URL = "https://aura-svzi.onrender.com";

const chat = document.querySelector("#chat");
const input = document.querySelector("#input");
const form = document.querySelector("#form");
const send = document.querySelector("#send");
const statusText = document.querySelector("#status");

const messages = [];

function addBubble(text, role) {
  chat.querySelector(".welcome")?.remove();

  const bubble = document.createElement("div");
  bubble.className = "msg " + role;
  bubble.textContent = text;

  chat.appendChild(bubble);
  chat.scrollTop = chat.scrollHeight;

  return bubble;
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const text = input.value.trim();
  if (!text || send.disabled) return;

  addBubble(text, "user");
  messages.push({ role: "user", content: text });

  input.value = "";
  input.style.height = "auto";
  send.disabled = true;
  statusText.textContent = "AURA is thinking…";

  const waiting = addBubble("Thinking…", "assistant");

  try {
    const response = await fetch(API_URL + "/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: messages.slice(-30) })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "The server returned an error.");
    }

    const reply = String(
      data.reply || "I couldn't generate a reply."
    );

    waiting.textContent = reply;
    messages.push({ role: "assistant", content: reply });
    statusText.textContent = "Your AI companion";

  } catch (error) {
    waiting.textContent =
      "I couldn't connect just now. Please try again in a moment.";

    statusText.textContent = "Connection issue";
    console.error("AURA chat error:", error);

    // Remove the failed message from the conversation history.
    messages.pop();

  } finally {
    send.disabled = false;
    input.focus();
    chat.scrollTop = chat.scrollHeight;
  }
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height =
    Math.min(input.scrollHeight, 120) + "px";
});

input.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});
</script>
</body>
</html>
