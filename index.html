
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111114">
<title>AURA</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{margin:0;background:#111114;color:#f4f2f8;font-family:system-ui,sans-serif}
.app{height:100dvh;max-width:760px;margin:auto;display:flex;flex-direction:column}
header{padding:13px 16px;border-bottom:1px solid #292932;display:flex;align-items:center;gap:12px}
.avatar{width:48px;height:48px;flex:none;border-radius:50%;position:relative;overflow:hidden;background:radial-gradient(circle at 35% 28%,#f3e8ff 0,#c4b5fd 18%,#8b5cf6 48%,#35205f 78%,#17121f 100%);box-shadow:0 0 22px #8b5cf655,inset 0 0 12px #ffffff44}
.avatar:before{content:"";position:absolute;width:25px;height:25px;left:11px;top:10px;border:2px solid #f4eaff;border-radius:50%;box-shadow:0 0 12px #fff9}
.avatar:after{content:"";position:absolute;width:5px;height:5px;left:21px;top:20px;border-radius:50%;background:white;box-shadow:0 0 10px 4px #fff9}
h1{font-size:17px;margin:0;letter-spacing:1.5px}
.sub{font-size:12px;color:#a5a2b0;margin-top:3px}
#login{padding:10px 12px;display:flex;gap:8px;border-bottom:1px solid #292932}
#login[hidden]{display:none}
#token{flex:1;min-width:0;border:1px solid #34333e;border-radius:14px;padding:11px;background:#1b1b21;color:white;font:inherit}
button{border:0;border-radius:14px;background:#a78bfa;color:#191522;font-size:15px;font-weight:650;padding:10px 16px}
button:disabled{opacity:.5}
#chat{flex:1;overflow:auto;padding:18px 13px;display:flex;flex-direction:column;gap:7px;scroll-behavior:smooth}
.welcome{text-align:center;color:#aaa6b5;margin:auto;line-height:1.7;padding:20px}
.welcome strong{display:block;color:#f4f2f8;font-size:25px;margin-bottom:8px}
.message-row{display:flex;flex-direction:column;max-width:88%;gap:4px}
.message-row.user{align-self:flex-end;align-items:flex-end}
.message-row.assistant{align-self:flex-start;align-items:flex-start}
.msg{padding:11px 14px;border-radius:18px;background:#202027;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap}
.user .msg{background:#7660c9;color:#fff;border-bottom-right-radius:5px}
.assistant .msg{border-bottom-left-radius:5px}
.stamp{font-size:10px;color:#8f8b9c;padding:0 5px}
.user .stamp{text-align:right}
form{display:flex;gap:8px;padding:11px 12px;padding-bottom:calc(11px + env(safe-area-inset-bottom));border-top:1px solid #292932;align-items:flex-end}
textarea{flex:1;resize:none;max-height:120px;min-width:0;border:1px solid #34333e;border-radius:22px;padding:12px;background:#1b1b21;color:white;font:inherit;outline:none}
textarea:focus,#token:focus{border-color:#a78bfa}
#send{width:46px;height:46px;padding:0;border-radius:50%;font-size:22px}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="avatar" role="img" aria-label="AURA's avatar"></div>
  <div>
    <h1>AURA</h1>
    <div class="sub" id="status">Your conversation space</div>
  </div>
</header>

<div id="login">
  <input id="token" type="password" autocomplete="current-password"
         placeholder="Private access token" aria-label="Access token">
  <button id="connect" type="button">Connect</button>
</div>

<main id="chat">
  <div class="welcome">
    <strong>AURA</strong>
    A new conversation, saved as we go.
  </div>
</main>

<form id="form">
  <textarea id="input" rows="1" placeholder="Message AURA..."
            aria-label="Message AURA" disabled></textarea>
  <button id="send" type="submit" aria-label="Send" disabled>↑</button>
</form>
</div>

<script>
const API_URL = "https://aura-svzi.onrender.com";

const chat = document.querySelector("#chat");
const input = document.querySelector("#input");
const form = document.querySelector("#form");
const send = document.querySelector("#send");
const statusText = document.querySelector("#status");
const login = document.querySelector("#login");
const tokenInput = document.querySelector("#token");
const connectButton = document.querySelector("#connect");

let token = "";
let busy = false;

let sessionId = localStorage.getItem("aura_session_id");
if (!sessionId) {
  sessionId = crypto.randomUUID();
  localStorage.setItem("aura_session_id", sessionId);
}

function formatTime(value = new Date()) {
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "";
  return date.toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit"
  });
}

function addBubble(text, role, timestamp = new Date()) {
  chat.querySelector(".welcome")?.remove();

  const row = document.createElement("div");
  row.className = "message-row " + role;

  const bubble = document.createElement("div");
  bubble.className = "msg";
  bubble.textContent = text;

  const stamp = document.createElement("div");
  stamp.className = "stamp";
  stamp.textContent = formatTime(timestamp);
  stamp.title = new Date(timestamp).toLocaleString();

  row.append(bubble, stamp);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;

  return { row, bubble, stamp };
}

function showWelcome() {
  chat.innerHTML = "";
  const welcome = document.createElement("div");
  welcome.className = "welcome";

  const title = document.createElement("strong");
  title.textContent = "AURA";
  welcome.append(title, document.createTextNode("A new conversation, saved as we go."));
  chat.appendChild(welcome);
}

async function api(path, body) {
  const response = await fetch(API_URL + path, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify(body)
  });

  const data = await response.json();

  if (!response.ok) {
    if (response.status === 401) {
      token = "";
      sessionStorage.removeItem("aura_access_token");
      input.disabled = true;
      send.disabled = true;
      login.hidden = false;
      statusText.textContent = "Please reconnect";
    }
    throw new Error(data.error || "Request failed");
  }

  return data;
}

async function connect() {
  const entered = tokenInput.value.trim();
  token = entered || sessionStorage.getItem("aura_access_token") || "";

  if (!token) {
    statusText.textContent = "Enter your access token";
    return;
  }

  connectButton.disabled = true;
  statusText.textContent = "Connecting…";

  try {
    const data = await api("/history", { sessionId });

    sessionStorage.setItem("aura_access_token", token);
    login.hidden = true;
    input.disabled = false;
    send.disabled = false;
    chat.innerHTML = "";

    if (!data.messages.length) {
      showWelcome();
    } else {
      data.messages.forEach(message =>
        addBubble(message.content, message.role, message.created_at)
      );
    }

    statusText.textContent = "Connected · history restored";
    chat.scrollTop = chat.scrollHeight;
  } catch (error) {
    token = "";
    login.hidden = false;
    statusText.textContent = error.message.includes("Access denied")
      ? "Incorrect access token"
      : "Could not connect — check Render";
    console.error("AURA connection error:", error);
  } finally {
    connectButton.disabled = false;
  }
}

connectButton.addEventListener("click", connect);
tokenInput.addEventListener("keydown", event => {
  if (event.key === "Enter") connect();
});

token = sessionStorage.getItem("aura_access_token") || "";
if (token) connect();

form.addEventListener("submit", async event => {
  event.preventDefault();

  const text = input.value.trim();
  if (!text || send.disabled || busy) return;

  const userTime = new Date();
  addBubble(text, "user", userTime);

  input.value = "";
  input.style.height = "auto";
  busy = true;
  send.disabled = true;
  statusText.textContent = "AURA is thinking…";

  const waiting = addBubble("Thinking…", "assistant", new Date());

  try {
    const data = await api("/chat", { sessionId, text });
    waiting.bubble.textContent = data.reply;
    waiting.stamp.textContent = formatTime(data.created_at || new Date());
    waiting.stamp.title = new Date(data.created_at || Date.now()).toLocaleString();
    statusText.textContent = "Connected · history saved";
  } catch (error) {
    waiting.bubble.textContent = "I couldn't complete that request. " + error.message;
    waiting.stamp.textContent = formatTime(new Date());
    statusText.textContent = "Connection issue";
    console.error("AURA chat error:", error);
  } finally {
    busy = false;
    send.disabled = !token;
    input.focus();
    chat.scrollTop = chat.scrollHeight;
  }
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
});

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});
</script>
</body>
</html>
